# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: livetimetable-api
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: livetimetable-shared
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_WEBHOOK_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: livetimetable-db
          property: connectionString

databases:
  - name: livetimetable-db
    databaseName: livetimetable
    user: livetimetable
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    diskSizeGB: 5
    region: singapore

envVarGroups:
  - name: livetimetable-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_SPREADSHEET_ID
        value: 1V5A1Z-PzrLs-92YCYmFA0L9fpwWbhVuN
      - key: GOOGLE_SHEET_GID
        value: '129828207'
      - key: PRIMARY_TIMETABLE_ENABLED
        value: 'false'
      - key: ADDITIONAL_TIMETABLES
        value: '[{"spreadsheet_id":"14B2j6u27W2OS4e1lXHMcBYZejYLy0nkt","sheet_gid":"129828207","label":"Term 2 timetable","enabled":true}]'
      - key: SYNC_INTERVAL_SECONDS
        value: '21600'
      - key: SYNC_ON_CHANGE
        value: 'false'
      - key: SYNC_MAX_WORKERS
        value: '2'
      - key: CANCELLED_EVENT_BEHAVIOUR
        value: mark_cancelled
      - key: TIMETABLE_TIMEZONE
        value: Asia/Kolkata
