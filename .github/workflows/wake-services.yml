name: Wake deployed services
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: wake-deployed-services
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://calendarapp-2r1h.onrender.com/
          - https://livetimetable-api.onrender.com/health
    steps:
      - name: Request public health endpoint
        env:
          HEALTH_URL: ${{ matrix.url }}
        run: >-
          curl --fail --silent --show-error --location
          --connect-timeout 20 --max-time 180
          --retry 2 --retry-delay 15 --retry-max-time 540
          --output /dev/null "$HEALTH_URL"
