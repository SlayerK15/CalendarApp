# Render-only deployment matching the existing Render services.
# Frontend and API both run on Render's free web service plan; the database is still paid.
# The sync job runs on a GitHub Actions schedule instead of a Render cron service.
services:
- type: web
  name: CalendarApp
  runtime: docker
  rootDir: frontend
  dockerfilePath: ./Dockerfile
  dockerContext: .
  plan: free
  region: singapore
  healthCheckPath: /
  autoDeployTrigger: checksPass
  envVars:
  - key: NEXT_PUBLIC_API_URL
    fromService:
      type: web
      name: livetimetable-api
      envVarKey: RENDER_EXTERNAL_URL
  - key: HOSTNAME
    value: 0.0.0.0
  - key: NODE_ENV
    value: production
- type: web
  name: livetimetable-api
  runtime: python
  rootDir: backend
  plan: free
  region: singapore
  buildCommand: pip install -r requirements.txt
  preDeployCommand: alembic upgrade head
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
  healthCheckPath: /health
  autoDeployTrigger: checksPass
  envVars:
  - fromGroup: livetimetable-shared
  - key: FRONTEND_URL
    sync: false
  - key: BACKEND_URL
    sync: false
  - key: ALLOWED_ORIGINS
    sync: false
  - key: GOOGLE_CLIENT_ID
    sync: false
  - key: GOOGLE_CLIENT_SECRET
    sync: false
  - key: GOOGLE_REDIRECT_URI
    sync: false
  - key: GOOGLE_WEBHOOK_SECRET
    sync: false
  - key: TOKEN_ENCRYPTION_KEY
    sync: false
  - key: DATABASE_URL
    sync: false
# livetimetable-db is kept here, unused, until the Neon cutover is confirmed
# stable in production; then delete it from Render and remove this block.
databases:
- name: livetimetable-db
  databaseName: livetimetable
  user: livetimetable
  plan: 0.1c-256mb
  postgresMajorVersion: '16'
  diskSizeGB: 5
  region: singapore
envVarGroups:
- name: livetimetable-shared
  envVars:
  - key: PYTHON_VERSION
    value: 3.12.12
  - key: ENVIRONMENT
    value: production
  - key: GOOGLE_SPREADSHEET_ID
    value: 1V5A1Z-PzrLs-92YCYmFA0L9fpwWbhVuN
  - key: GOOGLE_SHEET_GID
    value: '129828207'
  - key: PRIMARY_TIMETABLE_ENABLED
    value: 'false'
  - key: ADDITIONAL_TIMETABLES
    value: '[{"spreadsheet_id":"14B2j6u27W2OS4e1lXHMcBYZejYLy0nkt","sheet_gid":"129828207","label":"Term 2 timetable","enabled":true}]'
  - key: SYNC_INTERVAL_SECONDS
    value: '21600'
  - key: SYNC_ON_CHANGE
    value: 'false'
  - key: SYNC_MAX_WORKERS
    value: '2'
  - key: CANCELLED_EVENT_BEHAVIOUR
    value: mark_cancelled
  - key: TIMETABLE_TIMEZONE
    value: Asia/Kolkata
