services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livetimetable
      POSTGRES_PASSWORD: livetimetable
      POSTGRES_DB: livetimetable
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U livetimetable']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://livetimetable:livetimetable@db:5432/livetimetable
      PORT: 8000
    ports: ['8000:8000']
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports: ['3000:3000']
    depends_on: [backend]
  sync:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://livetimetable:livetimetable@db:5432/livetimetable
    command: ['python', '-m', 'app.jobs.sync_all']
    profiles: ['jobs']
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres-data:
